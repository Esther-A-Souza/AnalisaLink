<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnalisaLink | Histórico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-content">
    <h1>AnalisaLink</h1>
    <nav aria-label="Navegação">
      <ul class="abas">
        <li><a href="tela-inicial.html">Início</a></li>
        <li><a href="resultado.html">Resultado</a></li>
        <li><a href="historico.html" class="active" aria-current="page">Histórico</a></li>
      </ul>
    </nav>
  </div>
</header>
<main>
  <section class="card">
    <h2>Histórico de análises</h2>

    <div class="form-grid">
      <div class="field">
        <label for="filtro">Filtrar por URL ou classificação:</label>
        <input type="search" id="filtro" placeholder="Ex.: login ou suspeita" autocomplete="off">
      </div>
      <button type="button" id="limpar" class="secondary">Limpar histórico</button>
    </div>

    <p id="contagem" role="status"></p>
    <div id="lista" class="history-list"></div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
